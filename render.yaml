services:
  - type: web
    name: mns-delivery-api
    runtime: python
    plan: free
    region: singapore # Closest region to the Philippines
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render dashboard from your .env
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_KEY_ID
        value: mns-prod-key-1
      - key: MAPBOX_ACCESS_TOKEN
        value: pk.eyJ1IjoiamVhcmFyZCIsImEiOiJjbWE2ZjNlM2YwM2wyMmlvYW9mdDQ5OHJ5In0.57WdNE6fCl-qVJAoMZe40Q
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: menu-images
